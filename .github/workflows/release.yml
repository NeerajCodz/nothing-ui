name: Release

# Publishes nthgui to npm whenever version.json changes on main (or on manual run).
# nthgui's version comes from `ui` in version.json.
#
# Auth: npm trusted publishing (OIDC). No npm token is stored in this repo; GitHub Actions
# proves its identity to npm directly, and provenance is attached automatically.
# One-time setup on npmjs.com → nthgui → Settings → Trusted Publisher → GitHub Actions:
#   owner: NeerajCodz   repository: nothing-ui   workflow: release.yml
# See docs/releasing.md.
#
# If the version is already on npm, publishing is skipped but the live package is still
# smoke-tested and the GitHub release is created if missing.

on:
  push:
    branches: [main]
    paths:
      - version.json
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run everything but skip the real publish and GitHub release
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish nthgui to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the git tag and GitHub release
      id-token: write # npm trusted publishing (OIDC) and provenance
    env:
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use the latest npm CLI
        run: |
          npm install -g npm@latest
          echo "npm $(npm -v)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve release version
        id: version
        run: |
          SPEC="$(npm run --silent version:release)"
          NAME="${SPEC%@*}"
          VERSION="${SPEC##*@}"
          if [[ "$VERSION" == *-* ]]; then DIST_TAG=next; PRERELEASE=true; else DIST_TAG=latest; PRERELEASE=false; fi
          {
            echo "name=$NAME"
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "dist_tag=$DIST_TAG"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $NAME@$VERSION (dist-tag: $DIST_TAG)"

      - name: Check whether this version is already published
        id: published
        run: |
          if npm view "${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}" version > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }} is already on npm; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG
        run: npm run --silent changelog:extract -- "${{ steps.version.outputs.version }}" > release-notes.md

      - uses: actions/download-artifact@v5
        with:
          name: nthgui-tarball

      - name: Publish the verified tarball (trusted publishing)
        if: steps.published.outputs.exists == 'false'
        run: |
          TARBALL="$(ls nthgui-*.tgz)"
          ARGS=(--access public --tag "${{ steps.version.outputs.dist_tag }}")
          if [ "$DRY_RUN" = "true" ]; then
            npm publish "$TARBALL" "${ARGS[@]}" --dry-run
          else
            npm publish "$TARBALL" "${ARGS[@]}" || {
              echo "::error::npm publish failed. If this is ENEEDAUTH or a 404, check the Trusted Publisher on npmjs.com (owner NeerajCodz, repo nothing-ui, workflow release.yml). A brand-new package must be published once by hand first; see docs/releasing.md."
              exit 1
            }
          fi

      - name: Smoke test the live package with npx and npm install
        if: env.DRY_RUN != 'true'
        env:
          SMOKE_RETRIES: '8'
        run: npm run smoke -- "${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}"

      - name: Create git tag and GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          FLAGS=()
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" nthgui-*.tgz \
            --target "$GITHUB_SHA" \
            --title "nthgui $TAG" \
            --notes-file release-notes.md \
            "${FLAGS[@]}"

      - name: Summary
        run: |
          {
            echo "### nthgui ${{ steps.version.outputs.tag }}"
            if [ "$DRY_RUN" = "true" ]; then
              echo "Dry run — nothing was published."
            else
              if [ "${{ steps.published.outputs.exists }}" = "true" ]; then
                echo "Already on npm — publish skipped; live package smoke-tested."
              else
                echo "Published with trusted publishing and provenance."
              fi
              echo
              echo "https://www.npmjs.com/package/${{ steps.version.outputs.name }}/v/${{ steps.version.outputs.version }}"
              echo
              echo '```bash'
              echo "npx nthgui@${{ steps.version.outputs.version }} init"
              echo "npm install nthgui@${{ steps.version.outputs.version }}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
