name: Release

# Publishes nthgui to npm whenever version.json changes on main (or on manual run).
# nthgui's version comes from `ui` in version.json. If that version is already on npm,
# the run finishes without publishing.
#
# Requires the repository secret NPM_TOKEN: an npm automation (or granular publish) token.

on:
  push:
    branches: [main]
    paths:
      - version.json
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run everything but skip the real publish and GitHub release
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish nthgui to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the git tag and GitHub release
      id-token: write # npm provenance
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve release version
        id: version
        run: |
          SPEC="$(npm run --silent version:release)"
          NAME="${SPEC%@*}"
          VERSION="${SPEC##*@}"
          if [[ "$VERSION" == *-* ]]; then DIST_TAG=next; PRERELEASE=true; else DIST_TAG=latest; PRERELEASE=false; fi
          {
            echo "name=$NAME"
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "dist_tag=$DIST_TAG"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $NAME@$VERSION (dist-tag: $DIST_TAG)"

      - name: Configure npm auth from NPM_TOKEN
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > "$HOME/.npmrc"
          echo "Authenticated to npm as $(npm whoami)"

      - name: Check whether this version is already published
        id: published
        run: |
          if npm view "${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}" version > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }} is already on npm; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG
        run: npm run --silent changelog:extract -- "${{ steps.version.outputs.version }}" > release-notes.md

      - uses: actions/download-artifact@v4
        with:
          name: nthgui-tarball

      - name: Publish the verified tarball
        if: steps.published.outputs.exists == 'false'
        run: |
          TARBALL="$(ls nthgui-*.tgz)"
          ARGS=(--access public --tag "${{ steps.version.outputs.dist_tag }}")
          if [ "$DRY_RUN" = "true" ]; then
            npm publish "$TARBALL" "${ARGS[@]}" --dry-run
          else
            npm publish "$TARBALL" "${ARGS[@]}" --provenance
          fi

      - name: Smoke test the published package with npx
        if: steps.published.outputs.exists == 'false' && env.DRY_RUN != 'true'
        env:
          SMOKE_RETRIES: '8'
        run: npm run smoke -- "${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}"

      - name: Create git tag and GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          FLAGS=()
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" nthgui-*.tgz \
            --target "$GITHUB_SHA" \
            --title "nthgui $TAG" \
            --notes-file release-notes.md \
            "${FLAGS[@]}"

      - name: Summary
        run: |
          {
            echo "### nthgui ${{ steps.version.outputs.tag }}"
            if [ "${{ steps.published.outputs.exists }}" = "true" ]; then
              echo "Already on npm — publish skipped."
            elif [ "$DRY_RUN" = "true" ]; then
              echo "Dry run — nothing was published."
            else
              echo "Published to npm: https://www.npmjs.com/package/${{ steps.version.outputs.name }}/v/${{ steps.version.outputs.version }}"
              echo
              echo '```bash'
              echo "npx nthgui@${{ steps.version.outputs.version }} init"
              echo "npm install nthgui@${{ steps.version.outputs.version }}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
